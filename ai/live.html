  <script>
    (() => {
      const start = new Date("2026-08-05T19:30:00+08:00").getTime();
      const end = new Date("2026-08-05T21:30:00+08:00").getTime();
      const countdown = document.querySelector("#countdown");
      const badge = document.querySelector("#statusBadge");

      function render() {
        const now = Date.now();
        if (now >= end) {
          badge.textContent = "直播已結束";
          countdown.textContent = "感謝參加，回放資訊請留意官方 LINE";
          return;
        }
        if (now >= start) {
          badge.textContent = "直播進行中";
          countdown.textContent = "現在開播，請點擊播放器開始觀看";
          return;
        }
        const diff = start - now;
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        countdown.textContent = `距離開播還有 ${days} 天 ${hours} 小時 ${minutes} 分 ${seconds} 秒`;
      }

      render();
      window.setInterval(render, 1000);
    })();
