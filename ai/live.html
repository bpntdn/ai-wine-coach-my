<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI網紅製造所｜免費直播</title>
  <meta name="description" content="AI網紅製造所免費直播課｜下次時間敬請期待" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#060810" />
  <meta property="og:title" content="AI網紅製造所｜免費直播" />
  <meta property="og:description" content="AI網紅，由你定義｜下次時間敬請期待" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ai.winemaenads.com/live" />
  <link rel="canonical" href="https://ai.winemaenads.com/live" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #060810;
      --panel: rgba(15, 21, 35, 0.84);
      --line: rgba(130, 255, 212, 0.22);
      --text: #f5f8ff;
      --muted: #aeb8c9;
      --mint: #72f5c5;
      --cyan: #61c9ff;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(97, 201, 255, 0.18), transparent 34rem),
        radial-gradient(circle at 88% 12%, rgba(114, 245, 197, 0.15), transparent 30rem),
        linear-gradient(145deg, #05070d 0%, #091120 52%, #05070d 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }

    .page {
      position: relative;
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .mark {
      position: relative;
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid rgba(114, 245, 197, 0.64);
      border-radius: 50%;
      background: #071427;
      box-shadow:
        0 0 0 1px rgba(97, 201, 255, 0.14),
        0 0 18px rgba(97, 201, 255, 0.38),
        0 0 34px rgba(114, 245, 197, 0.18),
        0 12px 34px rgba(0,0,0,.36);
    }

    .mark::after {
      content: "";
      position: absolute;
      inset: 3px;
      pointer-events: none;
      border: 1px solid rgba(165, 230, 255, 0.2);
      border-radius: 50%;
      box-shadow: inset 0 0 15px rgba(97, 201, 255, 0.16);
    }

    .mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      transform: scale(1.055);
    }

    .brand strong { display: block; font-size: 17px; letter-spacing: .08em; }
    .brand span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; letter-spacing: .16em; }

    .live-badge {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--mint);
      background: rgba(114,245,197,.08);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
    }

    .hero {
      text-align: center;
      margin: 0 auto 24px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--mint);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 58px);
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    .gradient {
      background: linear-gradient(90deg, var(--cyan), var(--mint));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .time {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 20px);
      letter-spacing: .04em;
    }

    .countdown {
      margin: 12px 0 0;
      min-height: 24px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .player-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #000;
      box-shadow: 0 24px 70px rgba(0,0,0,.48), 0 0 50px rgba(97,201,255,.07);
    }

    .ended-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #05070d;
    }

    .ended-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
    }

    /* 深色遮罩：避免文字被綠西裝／機艙細節吃掉 */
    .ended-thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.34) 0%, rgba(0,0,0,.18) 38%, rgba(0,0,0,.72) 100%),
        radial-gradient(ellipse at 50% 78%, rgba(0,0,0,.55), transparent 62%);
    }

    .ended-caption {
      position: absolute;
      left: 50%;
      bottom: clamp(18px, 5%, 36px);
      z-index: 2;
      width: min(92%, 46rem);
      transform: translateX(-50%);
      padding: 16px 18px 18px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      background: rgba(4, 8, 16, .78);
      box-shadow: 0 12px 36px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .ended-caption strong {
      display: block;
      margin: 0 0 8px;
      color: #fff;
      font-size: clamp(18px, 3.4vw, 28px);
      line-height: 1.35;
      letter-spacing: .01em;
      text-shadow: 0 2px 10px rgba(0,0,0,.65);
    }

    .ended-caption p {
      margin: 0;
      color: #f3f6ff;
      font-size: clamp(13px, 2.2vw, 17px);
      line-height: 1.65;
      text-shadow: 0 1px 8px rgba(0,0,0,.6);
    }

    .below {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 22px;
      margin-top: 22px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .below p { margin: 0; color: var(--muted); line-height: 1.7; }
    .below strong { color: var(--text); }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      background: rgba(255,255,255,.04);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .button:hover { transform: translateY(-1px); border-color: var(--mint); background: rgba(114,245,197,.08); }
    .button.primary { color: #04120e; border-color: transparent; background: linear-gradient(90deg, var(--cyan), var(--mint)); }

    footer { margin-top: 24px; color: #7e899b; text-align: center; font-size: 12px; }

    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 1120px); padding-top: 20px; }
      .top { margin-bottom: 24px; }
      .mark { width: 62px; height: 62px; }
      .brand span { display: none; }
      .live-badge { padding: 7px 10px; font-size: 12px; }
      .player-shell { border-radius: 12px; }
      .ended-caption { padding: 12px 12px 14px; border-radius: 12px; }
      .below { grid-template-columns: 1fr; padding: 17px; }
      .actions { justify-content: stretch; }
      .button { flex: 1 1 150px; }
    }
  </style>
</head>
<body>

    <footer>© 2026 AI網紅製造所｜本頁為官方免費直播入口</footer>
  </main>
</body>
</html>
